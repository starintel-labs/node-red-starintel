<script type="text/javascript">
    RED.nodes.registerType('starintel-server', {
        category: 'config',
        color: '#f39c12',
        defaults: {
            name: { value: '' },
            baseUrl: { value: 'http://127.0.0.1:5000', required: true },
            timeoutMs: { value: 8000 }
        },
        label: function () {
            return this.name || this.baseUrl || 'starintel-server';
        }
    });
</script>

<script type="text/html" data-template-name="starintel-server">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name">
    </div>
    <div class="form-row">
        <label for="node-config-input-baseUrl"><i class="fa fa-globe"></i> Base URL</label>
        <input type="text" id="node-config-input-baseUrl" placeholder="http://127.0.0.1:5000">
        <div class="form-tips">starintel-server is an experimental operator system without ambient authentication. LAN-only: never point this at an untrusted network.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-timeoutMs"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="number" id="node-config-input-timeoutMs" placeholder="8000">
    </div>
</script>
